# .github/workflows/keep-alive.yml
name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 * * *' # Medianoche cada día
  workflow_dispatch:      # Permite ejecutarlo manualmente desde la web de GitHub para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        # Cambia esta URL por la que te de Railway al final
        run: curl -I https://tu-proyecto-en-railway.up.railway.app/api/health